# ==========================================
# General
# ==========================================
set -g mouse on
set -g history-limit 30000
set -g default-terminal "tmux-256color"
# Lets nvim see FocusGained, so autoread and gitsigns pick up changes made in
# another pane
set -g focus-events on
# Without extkeys, tmux strips the modifier from combos like C-/ and forwards a
# bare `/`, so nvim never sees the keymap
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Scoped to ghostty on purpose: declaring RGB for `*` would also promise
# truecolor to clients that cannot render it
set -ga terminal-features ",xterm-ghostty:RGB"

# ==========================================
# Prefix: C-a
# ==========================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==========================================
# Splits
# ==========================================
unbind %
bind v split-window -v
unbind '"'
bind h split-window -h

# ==========================================
# Copy mode (vi-style + pbcopy)
# ==========================================
setw -g mode-keys vi
set -g set-clipboard off

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ==========================================
# Claude Code waiting indicator
# ==========================================
# @claude_wait is set by scripts/claude-wait.sh from Claude Code's hooks: "ask"
# on Notification, "done" on Stop, "running" on each prompt or tool run,
# "idle" on session start or once a "done" has been seen
# Claude windows are all named after the binary (claude, claude.exe, or the
# native install's versions/<x.y.z> file, which shows up as a bare version), so
# label them by the pane title Claude Code sets from the conversation, minus
# its leading status glyph. A session started by a slash command never gets a
# title, so @claude_label (set by skills like autofix) takes precedence
# The native install's bare-version binary name is renamed back to claude so
# #W and the window picker still say which program the window runs
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'
set -g @win_label "#I:#{?@claude_label,#{@claude_label},#{?#{m/r:^(claude.*|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{=20:#{s/^. //:pane_title}},#W}}#{?window_flags,#{window_flags}, }"
set -g @wait_mark "#{?#{==:#{@claude_wait},ask},#[fg=black#,bg=yellow#,bold]💬 ,#{?#{==:#{@claude_wait},done},#[fg=black#,bg=blue#,bold]✅ ,#{?#{==:#{@claude_wait},running},🔄 ,#{?#{==:#{@claude_wait},idle},💤 ,}}}}"
set -g window-status-format "#{E:@wait_mark}#{E:@win_label}#[default]"
# The current window is already on screen, so it skips the wait marks and
# stays white to show where you are
set -g window-status-current-format "#[fg=black#,bg=white#,bold]#{E:@win_label}#[default]"

# "done" means finished but not yet seen, so visiting the window turns it idle;
# "ask" stays until the question is actually answered
set-hook -g session-window-changed 'if -F "#{==:#{@claude_wait},done}" "set -w @claude_wait idle"'

# tmux 3.8 defaults popups to a dark grey theme colour, which hides the
# terminal's own background and opacity
set -g popup-style default
set -g popup-border-style fg=brightblack

# Killing the attached session from the picker should land on another session
# instead of dropping out of tmux
set -g detach-on-destroy off

# New Claude Code window in a directory picked from the current one, its repo's
# worktrees and where Claude Code has run before. claude runs as the window's
# command, so the window closes itself on /exit instead of leaving an idle
# shell behind
bind C display-popup -E -w 70% -h 50% -d '#{pane_current_path}' '~/.config/tmux/scripts/claude-launcher.sh'

# Review popup on the repo or worktree this window runs in, or one Claude edited
# from it. It switches between uncommitted changes, the branch diff and the
# branch's commits inside, so one binding covers all three
bind e display-popup -E -w 90% -h 90% -d '#{pane_current_path}' '~/.config/tmux/scripts/review.sh'

# Fuzzy window switcher with a live preview of each window
bind f display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/window-picker.sh"

# ==========================================
# Plugins (TPM)
# Install plugins: prefix + I
# Update plugins:  prefix + U
# Remove plugins:  prefix + alt + u
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
