# ==========================================
# General
# ==========================================
set -g mouse on
set -g history-limit 30000
# Closing a window closes the gap in the numbers, so prefix + number and the
# picker line up with what the status bar shows
set -g renumber-windows on
set -g default-terminal "tmux-256color"
# Lets nvim see FocusGained, so autoread and gitsigns pick up changes made in
# another pane
set -g focus-events on
# Without extkeys, tmux strips the modifier from combos like C-/ and forwards a
# bare `/`, so nvim never sees the keymap
set -s extended-keys on
set -s terminal-features[10] 'xterm*:extkeys'
# Scoped to ghostty on purpose: declaring RGB for `*` would also promise
# truecolor to clients that cannot render it
set -s terminal-features[11] 'xterm-ghostty:RGB'

# ==========================================
# Prefix: C-a
# ==========================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==========================================
# Splits and windows
# ==========================================
# New panes and windows open in the current pane's directory, such as the
# worktree Claude runs in, instead of the session's starting directory
unbind %
bind v split-window -v -c '#{pane_current_path}'
unbind '"'
bind h split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# ==========================================
# Copy mode (vi-style + pbcopy)
# ==========================================
setw -g mode-keys vi
set -g set-clipboard off

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ==========================================
# Claude Code waiting indicator
# ==========================================
# @claude_wait is set by scripts/claude-wait.sh from Claude Code's hooks: "ask"
# on Notification, "done" on Stop, "running" on each prompt or tool run,
# "idle" on session start or once a "done" has been seen
# Claude windows are all named after the binary (claude, claude.exe, or the
# native install's versions/<x.y.z> file, which shows up as a bare version), so
# label them by the pane title Claude Code sets from the conversation, minus
# its leading status glyph. A session started by a slash command never gets a
# title, so @claude_label (set by skills like autofix) takes precedence
# The native install's bare-version binary name is renamed back to claude so
# #W and the window picker still say which program the window runs
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'
# How much a window needs you: 0 a Claude question, 1 a finished turn not seen
# yet, 2 nothing. The window picker sorts by it and prefix a follows it
set -g @claude_rank "#{?#{==:#{@claude_wait},ask},0,#{?#{==:#{@claude_wait},done},1,2}}"

# A window's label, shown in full by the window picker and shortened on the
# status bar
set -g @win_title "#{?@claude_label,#{@claude_label},#{?#{m/r:^(claude.*|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{s/^. //:pane_title},#W}}"
set -g @win_name "#{=18:#{E:@win_title}}#{?window_zoomed_flag, 󰊓,}"

# Claude marks, also read by scripts/window-picker.sh: needs an answer,
# finished and not seen yet, working (the spinner's first frame; the status
# bar turns it once a second), idle. A window with no mark is not running Claude
# docs/assets/marks/ holds the README's SVG copies of these icons
set -g @mark_ask "󰍡"
set -g @mark_ask_fg "#e0af68"
set -g @mark_done "󰗠"
set -g @mark_done_fg "#9ece6a"
set -g @mark_running "⣾"
set -g @mark_running_fg "#7dcfff"
set -g @mark_idle "󰖔"
set -g @mark_idle_fg "#545c7e"

# Status bar: the session, then each window with its Claude mark
set -g status-interval 1
set -g status-style "bg=#16161e,fg=#565f89"
set -g status-left-length 40
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold]  #S #[bg=#16161e,nobold]  "
set -g @spinner "#{?#{m:*0,%S},⣾,#{?#{m:*1,%S},⣾,#{?#{m:*2,%S},⣽,#{?#{m:*3,%S},⣻,#{?#{m:*4,%S},⢿,#{?#{m:*5,%S},⡿,#{?#{m:*6,%S},⡿,#{?#{m:*7,%S},⣟,#{?#{m:*8,%S},⣯,⣷}}}}}}}}}"
set -g @wait_icon "#{?#{==:#{@claude_wait},ask},#[fg=#{@mark_ask_fg}]#{@mark_ask} ,#{?#{==:#{@claude_wait},done},#[fg=#{@mark_done_fg}]#{@mark_done} ,#{?#{==:#{@claude_wait},running},#[fg=#{@mark_running_fg}]#{E:@spinner} ,#{?#{==:#{@claude_wait},idle},#[fg=#{@mark_idle_fg}]#{@mark_idle} ,}}}}"
set -g window-status-separator "  "
set -g window-status-format " #[fg=#545c7e]#I #{E:@wait_icon}#[fg=#737aa2]#{E:@win_name} #[default]"
# The window you are looking at only shows that Claude is working
set -g window-status-current-format "#[fg=#7aa2f7,bg=#292e42,bold] #I #{?#{==:#{@claude_wait},running},#[fg=#{@mark_running_fg}#,nobold]#{E:@spinner} #[bold],}#[fg=#c0caf5]#{E:@win_name} #[default]"

# Right: Claude questions and finished turns waiting in your other sessions,
# then the time
set -g @asks_elsewhere "#{n:#{S:#{?#{==:#{session_name},#{client_session}},,#{W:#{?#{==:#{@claude_wait},ask},x,}}}}}"
set -g @done_elsewhere "#{n:#{S:#{?#{==:#{session_name},#{client_session}},,#{W:#{?#{==:#{@claude_wait},done},x,}}}}}"
set -g status-right-length 40
set -g status-right "#{?#{!=:#{E:@asks_elsewhere},0},#[fg=#{@mark_ask_fg}]#{@mark_ask} #{E:@asks_elsewhere}  ,}#{?#{!=:#{E:@done_elsewhere},0},#[fg=#{@mark_done_fg}]#{@mark_done} #{E:@done_elsewhere}  ,}#[fg=#a9b1d6,bg=#292e42] 󰥔 %H:%M #[default]"

# "done" means finished but not yet seen, so visiting the window turns it idle;
# "ask" stays until the question is actually answered
set-hook -g session-window-changed 'if -F "#{==:#{@claude_wait},done}" "set -w @claude_wait idle"'
# Same when switching to another session
set-hook -g client-session-changed 'if -F "#{==:#{@claude_wait},done}" "set -w @claude_wait idle"'

# Keeps the list of Claude conversations reopened after a restart in step when
# windows close or move or a session is renamed
set-hook -g window-unlinked 'run-shell -b "~/.config/tmux/scripts/claude-wait.sh snapshot"'
set-hook -g window-linked 'run-shell -b "~/.config/tmux/scripts/claude-wait.sh snapshot"'
set-hook -g session-renamed 'run-shell -b "~/.config/tmux/scripts/claude-wait.sh snapshot"'

# Popups stay see-through, with a blue border
set -g popup-style default
set -g popup-border-style fg=#7aa2f7

# Killing the attached session from the picker should land on another session
# instead of dropping out of tmux
set -g detach-on-destroy off

# New Claude Code window in a directory picked from the current one, its repo's
# worktrees and where Claude Code has run before. claude runs as the window's
# command, so the window closes itself on /exit instead of leaving an idle
# shell behind
bind C display-popup -E -w 70% -h 50% -d '#{pane_current_path}' '~/.config/tmux/scripts/claude-launcher.sh'

# Review popup on the repo or worktree this window runs in, or one Claude edited
# from it. It switches between uncommitted changes, the branch diff and the
# branch's commits inside, so one binding covers all three
bind e display-popup -E -w 90% -h 90% -d '#{pane_current_path}' '~/.config/tmux/scripts/review.sh'

# lazygit on the repo or worktree this window runs in
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit

# Fuzzy window switcher with a live preview of each window
bind f display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/window-picker.sh"

# Next Claude window waiting for you, in any session: questions before results
bind a run-shell "~/.config/tmux/scripts/claude-jump.sh"

# Reopen the Claude conversations that were running when the previous tmux
# server went down. It runs while the server loads this file, before
# `tmux new -A -s main` creates its session, so a conversation that was in main
# is already there when you attach. Sourcing this file again finds nothing left
# to resume
run-shell "~/.config/tmux/scripts/claude-resume.sh"

# ==========================================
# Plugins (TPM)
# Install plugins: prefix + I
# Update plugins:  prefix + U
# Remove plugins:  prefix + alt + u
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
